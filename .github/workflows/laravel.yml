name: Laravel

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.1, 8.2, 8.3 ]
        laravel: [ 10.*, 11.* ]
        exclude:
          - php: 8.1
            laravel: 11.*

  laravel-tests:

    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
      - with:
        php-version: ${{ matrix.php }}
        extensions: dom, curl, libxml, mbstring, iconv, intl, zip, pdo_sqlite
        tools: composer:v2
        coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update --dev
          composer update --prefer-stable --no-interaction

      - name: Setup dusk/chrome
        run: vendor/bin/dusk-updater detect --no-interaction

      - name: Run Unit tests
        run: vendor/bin/phpunit --testsuite Unit
        env:
          RUNNING_IN_CI: true

      - name: Run Browser tests
        if: success() || failure()
        run: vendor/bin/phpunit --testsuite Browser
        env:
          RUNNING_IN_CI: true

      - name: Run Legacy Browser tests
        if: success() || failure()
        run: vendor/bin/phpunit --testsuite LegacyBrowser
        env:
          RUNNING_IN_CI: true

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute tests via PHPUnit
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

